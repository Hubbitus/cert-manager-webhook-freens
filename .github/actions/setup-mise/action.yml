name: setup-mise
description: >-
  Install mise pinned by version and binary sha256, then the tools from
  mise.toml at the checksums in mise.lock (the action adds --locked).
runs:
  using: composite
  steps:
    # Bumping mise: change version and sha256 together. sha256 is of the
    # extracted mise binary (not the archive), see mise-action's `sha256` input.
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.9.16
        sha256: b6f8757201f6a2ee799f45f3f52ef7ca0b4071523637dc3b0b24264dd3333518
