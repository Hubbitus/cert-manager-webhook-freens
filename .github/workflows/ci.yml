name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: make vet
      - run: make lint
      - run: make test
      - run: make helm-lint

  # cert-manager conformance against the live FreeNS zone.
  conformance:
    if: github.event_name == 'push'
    needs: unit
    runs-on: ubuntu-24.04
    # Runs share one FreeNS zone; names are unique per run, serialising is a cheap extra guard.
    concurrency:
      group: conformance-freens
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Require FREENS_API_KEY
        env:
          FREENS_API_KEY: ${{ secrets.FREENS_API_KEY }}
        run: |
          if [ -z "$FREENS_API_KEY" ]; then
            echo "::error::GitHub secret FREENS_API_KEY is not set"
            exit 1
          fi
      - name: Conformance
        env:
          FREENS_API_KEY: ${{ secrets.FREENS_API_KEY }}
        run: make test-conformance
