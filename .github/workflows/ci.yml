name: ci

# Tags are covered by the release workflow, which runs the same checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - run: make check
      - run: make smoke

  conformance:
    if: github.event_name == 'push'
    needs: check
    uses: ./.github/workflows/conformance.yml
    # Environment secrets (FREENS_API_KEY in `conformance`) reach a called
    # workflow only with `secrets: inherit`, although the docs imply the
    # job-level `environment` alone suffices (actions/runner#1490).
    # inherit also passes every repo-level secret: keep repo-level secrets
    # empty, credentials live only in environments.
    secrets: inherit
