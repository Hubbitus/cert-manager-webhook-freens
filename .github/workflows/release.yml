name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: docker.io/hubbitus/cert-manager-webhook-freens
  CHART_REPO: oci://registry-1.docker.io/hubbitus

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Check tag matches chart version and appVersion
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart=deploy/cert-manager-webhook-freens/Chart.yaml
          chart_version=$(awk '$1 == "version:" {print $2}' "$chart")
          app_version=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' "$chart")
          if [ "$chart_version" != "$version" ] || [ "$app_version" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME != Chart.yaml version $chart_version / appVersion $app_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: make vet lint test

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Package and push chart
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          helm package deploy/cert-manager-webhook-freens --destination _out
          helm push "_out/cert-manager-webhook-freens-${{ steps.version.outputs.version }}.tgz" "$CHART_REPO"

      - name: Summary
        run: |
          {
            echo "image: \`${IMAGE}:${{ steps.version.outputs.version }}@${{ steps.build.outputs.digest }}\`"
            echo "chart: \`${CHART_REPO}/cert-manager-webhook-freens\` version \`${{ steps.version.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
