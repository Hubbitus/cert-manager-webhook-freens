name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: docker.io/hubbitus/cert-manager-webhook-freens
  CHART_NAMESPACE: hubbitus
  CHART_DIR: deploy/cert-manager-webhook-freens
  # Differs from the image repository name: helm push uses it as the repository.
  CHART_NAME: cert-manager-webhook-freens-chart

jobs:
  # No secrets here: tag guard and all checks.
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Check tag matches chart version and appVersion
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart="$CHART_DIR/Chart.yaml"
          chart_version=$(awk '$1 == "version:" {print $2}' "$chart")
          app_version=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' "$chart")
          if [ "$chart_version" != "$version" ] || [ "$app_version" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME != Chart.yaml version $chart_version / appVersion $app_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Chart repository must differ from the image repository
        run: |
          chart_name=$(awk '$1 == "name:" {print $2}' "$CHART_DIR/Chart.yaml")
          if [ "$chart_name" != "$CHART_NAME" ]; then
            echo "::error::Chart.yaml name $chart_name != CHART_NAME $CHART_NAME"
            exit 1
          fi
          # helm push stores the chart as <namespace>/<chart name>; a shared
          # repository would let chart and image retag each other.
          if [ "docker.io/$CHART_NAMESPACE/$CHART_NAME" = "$IMAGE" ]; then
            echo "::error::chart repository docker.io/$CHART_NAMESPACE/$CHART_NAME equals image repository $IMAGE"
            exit 1
          fi

      - uses: ./.github/actions/setup-mise
      - run: make check
      - run: make smoke

  # Environment `conformance` scopes FREENS_API_KEY to this job.
  conformance:
    needs: verify
    uses: ./.github/workflows/conformance.yml

  # Pushes image and chart; no id-token here.
  publish:
    needs: [verify, conformance]
    runs-on: ubuntu-24.04
    # Holds DOCKERHUB_TOKEN (secret) and DOCKERHUB_USERNAME (variable).
    environment: release
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      chart-digest: ${{ steps.chart.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Package and push chart
        id: chart
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          helm package "$CHART_DIR" --destination _out
          helm push "_out/$CHART_NAME-$VERSION.tgz" "oci://registry-1.docker.io/$CHART_NAMESPACE" | tee _out/push.log
          digest=$(awk '$1 == "Digest:" {print $2}' _out/push.log)
          if [ -z "$digest" ]; then
            echo "::error::no digest in helm push output"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Signs what publish pushed, by digest. The only job with id-token.
  sign:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    # Signatures are pushed next to the artifacts, so registry login is needed.
    environment: release
    permissions:
      contents: read
      id-token: write # cosign keyless signing
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image and chart by digest (keyless)
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
          CHART_DIGEST: ${{ needs.publish.outputs.chart-digest }}
        run: |
          cosign sign --yes "${IMAGE}@${IMAGE_DIGEST}"
          cosign sign --yes "docker.io/${CHART_NAMESPACE}/${CHART_NAME}@${CHART_DIGEST}"

      - name: Summary
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
          CHART_DIGEST: ${{ needs.publish.outputs.chart-digest }}
        run: |
          {
            echo "image: \`${IMAGE}:${VERSION}@${IMAGE_DIGEST}\` (signed)"
            echo "chart: \`oci://registry-1.docker.io/${CHART_NAMESPACE}/${CHART_NAME}\` version \`${VERSION}\`, digest \`${CHART_DIGEST}\` (signed)"
          } >> "$GITHUB_STEP_SUMMARY"
